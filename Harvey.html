<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blood Match - Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Blood<span>Match</span></div>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>

    <div class="form-box">
      <h2>Log In</h2>
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
        </div>
        <button type="submit" class="btn" style="width: 100%">Log In</button>
      </form>
      <p class="form-note">
        Don't have an account?
        <a href="contact.html" style="color: #c62828">Sign up here</a>
      </p>
      <p class="form-note">
        <a href="#" style="color: #888888">Forgot password?</a>
      </p>
    </div>

    <footer class="footer">
      <p>&copy; 2026 Blood Match. All rights reserved.</p>
      <div class="footer-links">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </footer>
  </body>
</html>
